name: Deploy Kuymo website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-website.yml'
      - 'website/**'
      - 'lib/l10n/**'
      - 'brand/kuymo/tokens.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          cache: true
          cache_dependency_path: website/pnpm-lock.yaml

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build static website
        run: pnpm verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
