name: zumi
description: "Offline Target-Size Video Compressor Powered by Zumi Engine"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  rust_lib_zumi:
    path: rust_builder
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  bloc_signals_flutter: ^1.5.0
  bloc_signals_hydrate: ^1.1.0
  lucide_icons_flutter: ^4.0.0
  smooth_page_indicator: ^3.0.0
  toastification: ^3.2.1
  freezed_annotation: ^3.1.0
  flutter_hooks: ^0.21.3+1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  money2: ^6.3.1
  injectable: ^3.0.0
  formz: ^0.8.1
  meta: ^1.19.0
  kaisel: ^1.1.0
  connectivity_plus: ^4.0.1
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.5.2
  get_it: ^9.3.0
  rive: ^0.14.11
  flutter_svg: ^2.3.2
  cached_network_image_ce: ^4.13.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^3.0.2
  freezed: ^4.0.1
  json_serializable: ^6.13.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  intl_utils: ^2.8.14
  retrofit_generator: ^10.2.5
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  dartproptest: ^0.2.1
  kaisel_lint: ^0.5.1
  pigeon: ^29.1.0

flutter:
  generate: true
  uses-material-design: true
