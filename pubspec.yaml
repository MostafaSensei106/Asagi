name: kuymo
description: "On-device video tools with target-size compression and optional local AI"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.2-dev.2+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_edge_ai: ^2.7.2
  flutter_edge_ai_litertlm: ^1.21.3
  # Match the adapter's runtime: it is the single owner of native libraries.
  litertlm_dart: 0.19.1+4
  bloc_signals_flutter: ^1.5.0
  bloc_signals_hydrate: ^1.1.0
  lucide_icons_flutter: ^4.0.0
  toastification: ^3.2.1
  material_ui: ^1.10.0
  freezed_annotation: ^3.1.0
  flutter_hooks: ^0.21.3+1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  injectable: ^3.0.0
  meta: ^1.19.0
  kaisel: ^1.1.0
  bloc_signals: ^1.7.0
  cryptography: ^2.9.0
  gal: ^3.0.0
  intl: ^0.20.3
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  flutter_animate: ^4.5.2
  get_it: ^9.3.0
  flutter_svg: ^2.3.2
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  video_player: ^2.14.1
  video_player_platform_interface: ^6.9.0
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  cupertino_ui: ^1.1.6
  country_flags: ^4.1.2
  cupertino_modal_sheet: ^1.1.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  pub_semver: ^2.2.1
  flutter_local_notifications: ^23.0.4
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_performance: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^3.0.2
  freezed: ^4.0.1
  json_serializable: ^6.13.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  retrofit_generator: ^10.2.5
  mocktail: ^1.0.5
  pigeon: ^30.0.2

flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/icons/play_store_512.png
  - assets/icons/social/
  - assets/fonts/Google_Sans/OFL.txt

  fonts:
  # Google Sans static instances. Registering each weight/style lets Flutter
  # resolve `fontWeight` and `fontStyle` from TextStyle without extra config.
  - family: GoogleSans
    fonts:
    - asset: assets/fonts/Google_Sans/static/GoogleSans-Regular.ttf
      weight: 400
    - asset: assets/fonts/Google_Sans/static/GoogleSans-Italic.ttf
      weight: 400
      style: italic
    - asset: assets/fonts/Google_Sans/static/GoogleSans-Medium.ttf
      weight: 500
    - asset: assets/fonts/Google_Sans/static/GoogleSans-MediumItalic.ttf
      weight: 500
      style: italic
    - asset: assets/fonts/Google_Sans/static/GoogleSans-SemiBold.ttf
      weight: 600
    - asset: assets/fonts/Google_Sans/static/GoogleSans-SemiBoldItalic.ttf
      weight: 600
      style: italic
    - asset: assets/fonts/Google_Sans/static/GoogleSans-Bold.ttf
      weight: 700
    - asset: assets/fonts/Google_Sans/static/GoogleSans-BoldItalic.ttf
      weight: 700
      style: italic
