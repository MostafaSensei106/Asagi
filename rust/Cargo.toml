[package]
name = "rust_lib_asagi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.aarch64-linux-android.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[target.armv7-linux-androideabi.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[target.x86_64-linux-android.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
proptest = "1.0.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
