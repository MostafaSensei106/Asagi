[package]
name = "rust_lib_zumi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
rsa = { version = "0.9.8", features = ["sha1"] }
sha1 = { version = "0.10.6", features = ["oid"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }

[target.aarch64-linux-android.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[target.armv7-linux-androideabi.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[target.x86_64-linux-android.dependencies]
rsmpeg = { version = "0.16.1", default-features = false, features = ["ffmpeg7_1"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
proptest = "1.0.0"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
